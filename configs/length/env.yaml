#####################################################################################
#   Environment Configuration - sets the environment the experiments run in         #
#####################################################################################

workspace: outputs/length
verbose: false
debug: false
device: cuda

args:
  T: 500
  dt: 1.0
  v_th: 1.0
  v_reset: 0.0
  v_0: 2.12

trackers:
  - type: LogTracker
    name: "log"
    verbose: true
  
  - type: DBTracker
    name: experiment.db
    verbose: true
  
  - type: MLflowTracker
    name: experiment

  - type: TensorBoardTracker
    name: experiment

