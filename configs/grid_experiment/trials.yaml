# Grid Search Experiment
# batch_size: [1, 4, 16]
# lr: [0.1, 0.05, 0.01]
# epsilon: [1e-4, 1e-5]
# Total: 3 × 3 × 2 = 18 trials

# Batch size 1 trials
- name: "trial_lr_0.1_batch_1_eps_1e-4"
  info: "Grid search: lr=0.1, batch=1, eps=1e-4"
  repeat: 2
  settings:
    optimizer:
      lr: 0.1
    pipeline:
      batch_size: 1
    model:
      layers:
        - learning_rules:
            - type: "SequentialSingleSpikeLR"
              threshold: 1.0
            - type: "PlasticityInduction"
              threshold: 1.0
              epsilon: 1.0e-4

