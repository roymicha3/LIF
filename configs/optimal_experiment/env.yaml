#####################################################################################
#   Environment Configuration - Optimal Experiment                                  #
#####################################################################################

workspace: outputs/optimal_experiment
verbose: false
debug: false
device: cpu

args:
  T: 500
  dt: 1.0
  v_th: 1.0
  v_reset: 0.0
  v_0: 2.12

trackers:
  - type: LogTracker
    name: "log"
    verbose: false

  - type: DBTracker
    name: experiment.db
    verbose: false

  - type: MLflowTracker
    name: experiment

  - type: TensorBoardTracker
    name: experiment
