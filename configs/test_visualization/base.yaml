#####################################################################################
#   Base Configuration - Small test for VisualizationCallback                       #
#####################################################################################

# Model Architecture (small for fast testing)
model:
  type: "SequentialNetwork"
  layers:
    - name: "input layer"
      input_size: 50 # Small: 50 neurons instead of 500
      output_size: 1
      kernel:
        type: "SequentialDenKernel"
        n: 50 # Match input_size
        tau: 10
        tau_s: 10
        tau_m: 2.5
        learning: False
        scale: False

      learning_rules:
        - type: "SequentialSingleSpikeLR"
          threshold: 1.0

        - type: "PlasticityInduction"
          threshold: 1.0
          epsilon: 1.0e-5

      activation:
        type: "SubtractActivation"
        threshold: 0.0

# Optimizer
optimizer:
  type: MomentumOptimizer
  lr: 0.1
  momentum: 0.99

# LR Scheduler
lr_scheduler:
  type: ConstantLR
  args:

# Loss Function
loss:
  type: "BinaryLoss"

# Dataset (small for fast testing)
dataset:
  type: "RandomDataset"
  input_size: 50 # Match model input_size
  len: 20 # Small: 20 samples
  root: "./outputs/data/test-visualization"
  normalize: False
  flatten: True

  encoder:
    type: "LatencyEncoder"
    size: 50 # Match input_size
    max_value: 1.0

# Pipeline
pipeline:
  type: "SequentialPipeline"
  epochs: 5 # Small: 5 epochs
  batch_size: 4
  validation_split: 0.5
  test_split: 0.0
  shuffle: True

  # Callbacks
  callbacks:
    - type: "MetricsTracker"

    - type: "VisualizationCallback"
      plot_frequency: 2 # Plot epochs 0, 2, 4
      plot_voltage: true
      plot_spikes: true
      max_samples: 2
      capture_batch: 0  # Capture from first batch (default)
      plot_mode: "deferred"  # "deferred" or "immediate"

    - type: "EarlyStopping"
      metric: "val_loss"
      patience: 100 # Effectively disabled for testing
      min_delta_percent: 5.0
