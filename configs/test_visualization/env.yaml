#####################################################################################
#   Environment Configuration - Small test environment                              #
#####################################################################################

workspace: outputs/test_visualization
verbose: false
debug: false
device: cpu                   # Use CPU for testing (faster startup)

args:
  T: 100                      # Small: 100 timesteps instead of 500
  dt: 1.0
  v_th: 1.0
  v_reset: 0.0
  v_0: 2.12

trackers:
  - type: LogTracker
    name: "log"
    verbose: false

  - type: DBTracker
    name: experiment.db
    verbose: false




