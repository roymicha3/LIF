#####################################################################################
#   Base Configuration - contains all the objects that are used in the experiment   #
#####################################################################################

# Model Architecture
model:
  type: "SequentialNetwork"
  layers:
    - name: "input layer"
      input_size: 100
      output_size: 1
      kernel:
        type: "SequentialDenKernel"
        n: 100
        tau: 10
        tau_s: 15
        tau_m: 3.75
        learning: False
        scale: False
      
      learning_rule:
        type: "SequentialSingleSpikeLR"
        threshold: 0.5

      activation:
        type: "SubtractActivation"
        threshold: 0.5

# Optimizer
optimizer:
  type: MomentumOptimizer
  lr: 100
  momentum: 0.99

# LR Scheduler
lr_scheduler:
  type: StepLR
  args:
    step_size: 50
    gamma: 0.9

# Loss Function
loss:
  type: "BinaryLoss"

# Dataset
dataset:
  type: "RandomDataset"
  input_size: 100
  len: 150
  root: "./outputs/data/random-size-100"  # Path to the dataset
  normalize: False  # Normalize values to [0, 1]
  flatten: True

  encoder:
    type: "LatencyEncoder"
    size: 100
    max_value: 1.0

# Pipeline
pipeline:
  type: "SequentialPipeline"
  epochs: 100
  batch_size: 64
  validation_split: 0.2
  test_split: 0.2
  early_stopping_patience: 15
  shuffle: True

  # Callbacks (Optional)
  callbacks:
    - type: "MetricsTracker"
    
    - type: "EarlyStopping"
      metric: "val_loss"
      patience: 3
      min_delta_percent: 5.0
    
    - type: "CheckpointCallback"
      interval: 5